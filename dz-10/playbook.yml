---
- name: Deploy nginx container with Docker
  hosts: all
  become: yes
  vars:
    container_name: nginx_web
    host_port: 8081
    container_port: 80
    nginx_config_path: /etc/nginx/conf.d/default.conf
    html_path: /var/www/html
    source_files_dir: "{{ playbook_dir }}/files"

  tasks:
    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Docker is installed (RedHat)
      yum:
        name: docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create directory for nginx config on host
      file:
        path: "{{ nginx_config_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Create directory for HTML files on host
      file:
        path: "{{ html_path }}"
        state: directory
        mode: '0755'

    - name: Copy nginx config to host
      copy:
        src: "{{ source_files_dir }}/nginx.conf"
        dest: "{{ nginx_config_path }}"
        mode: '0644'

    - name: Copy index.html to host
      copy:
        src: "{{ source_files_dir }}/index.html"
        dest: "{{ html_path }}/index.html"
        mode: '0644'

    - name: Stop and remove existing container if exists
      docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: yes

    - name: Run nginx container
      docker_container:
        name: "{{ container_name }}"
        image: nginx:latest
        state: started
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"
        volumes:
          - "{{ nginx_config_path }}:/etc/nginx/conf.d/default.conf:ro"
          - "{{ html_path }}:/usr/share/nginx/html:ro"
        networks:
          - name: bridge

    - name: Wait for nginx to be ready
      uri:
        url: "http://localhost:{{ host_port }}"
        status_code: 200
        timeout: 5
      register: result
      until: result.status == 200
      retries: 10
      delay: 2

    - name: Display success message
      debug:
        msg: |
          ✅ Nginx container is running!
          📡 Access at: http://localhost:{{ host_port }}
          📁 HTML files mounted from: {{ html_path }}
          ⚙️  Config mounted from: {{ nginx_config_path }}
