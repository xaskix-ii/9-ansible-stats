<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx на Docker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .status {
            color: #4ade80;
            font-weight: bold;
            margin: 1rem 0;
        }
        .info {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        code {
            background: #333;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Nginx на Docker</h1>
        <p>Контейнер успешно запущен с помощью Ansible!</p>
        <div class="status">✅ Статус: Работает</div>
        <hr>
        <div class="info">
            <p>Порт хоста: <code>8081</code> → порт контейнера: <code>80</code></p>
            <p>Файл <code>index.html</code> смонтирован извне</p>
            <p>Ansible Playbook: <code>nginx-docker-playbook</code></p>
        </div>
    </div>
</body>
</html>
